name: NWP fix tests

on:
  push:
    branches:
      - fix/nwp-training-protocol-actual
      - feat/weather-condition-system
  pull_request:
    paths:
      - "features/**"
      - "collectors/**"
      - "config/**"
      - "evaluation/**"
      - "persistence/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pytest
      - name: Run regression tests
        run: |
          pytest \
            tests/test_nwp_training.py \
            tests/test_prediction_frame.py \
            tests/test_previous_runs_training.py \
            tests/test_nwp_fallback.py \
            tests/test_causal_features.py \
            tests/test_apply_nwp_training_fix.py \
            tests/test_weather_condition.py \
            tests/test_condition_collector.py \
            tests/test_condition_pipeline_contract.py \
            tests/test_weather_metrics.py \
            tests/test_history_window.py \
            tests/test_forecast_run_persistence.py \
            tests/test_verification_truth.py \
            -q
      - name: Compile changed modules
        run: |
          python -m py_compile \
            features/nwp_training.py \
            features/nwp_aware_engineer.py \
            features/prediction_frame.py \
            features/nwp_fallback.py \
            features/weather_condition.py \
            features/history_window.py \
            collectors/condition_forecasts.py \
            collectors/training_forecasts.py \
            collectors/verification_truth.py \
            evaluation/weather_metrics.py \
            persistence/forecast_runs.py \
            src/train_nwp_models.py \
            src/pipeline.py \
            scripts/apply_nwp_training_fix.py
